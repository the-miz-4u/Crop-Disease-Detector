<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision AI - Premium</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Premium Dark Mesh Background */
        .mesh-bg {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(158, 93%, 30%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(158, 93%, 30%, 0.15) 0px, transparent 50%);
        }

        /* AI Laser Scanning Animation */
        .scanner-line {
            width: 100%;
            height: 3px;
            background: #34d399;
            box-shadow: 0 0 15px 5px rgba(52, 211, 153, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            animation: scan 2s infinite ease-in-out alternate;
            display: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% - 3px); opacity: 0; }
        }
    </style>
</head>
<body class="mesh-bg min-h-screen text-slate-200 flex items-center justify-center p-4 relative overflow-x-hidden">
    
    <!-- Background Ambient Glows -->
    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-emerald-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-teal-800/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Main Glassmorphism Interface -->
    <div class="relative z-10 w-full max-w-2xl bg-slate-800/40 backdrop-blur-2xl border border-slate-700/50 rounded-[2.5rem] p-8 md:p-12 shadow-2xl">
        
        <!-- Header -->
        <div class="flex items-center justify-center mb-10 gap-5">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 border border-white/10">
                <i class="fa-solid fa-leaf text-3xl text-white drop-shadow-md"></i>
            </div>
            <div>
                <h1 class="text-4xl font-bold text-white tracking-tight">AgriVision <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">AI</span></h1>
                <p class="text-slate-400 text-sm mt-1 font-medium tracking-wide">INTELLIGENT CROP DIAGNOSIS</p>
            </div>
        </div>

        <form id="uploadForm" class="space-y-8">
            <!-- Custom Image Upload Area -->
            <div id="dropZone" class="relative group cursor-pointer rounded-3xl">
                <input type="file" id="fileInput" name="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 z-50 cursor-pointer" required>
                
                <!-- Animated Border -->
                <div class="absolute inset-0 rounded-3xl border-2 border-dashed border-slate-600 group-hover:border-emerald-400/80 transition-colors duration-300 pointer-events-none z-20"></div>
                
                <div class="relative bg-slate-800/50 rounded-3xl overflow-hidden transition-all duration-300 group-hover:bg-slate-700/50">
                    
                    <!-- Idle State -->
                    <div id="uploadPrompt" class="flex flex-col items-center justify-center py-16 px-6 text-center">
                        <div class="w-20 h-20 mb-6 rounded-full bg-slate-900/50 flex items-center justify-center group-hover:scale-110 group-hover:bg-emerald-500/20 transition-all duration-500 shadow-inner">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-emerald-400"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-white mb-2">Upload Plant Image</h3>
                        <p class="text-sm text-slate-400">Drag & drop or click to browse</p>
                    </div>

                    <!-- Preview State with Scanner -->
                    <div id="previewContainer" class="hidden relative w-full h-80 bg-slate-900">
                        <img id="imagePreview" class="w-full h-full object-contain" src="" alt="Preview">
                        <div id="scannerLine" class="scanner-line"></div>
                        
                        <!-- Hover Overlay to Change Image -->
                        <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center backdrop-blur-sm z-30">
                            <span class="px-5 py-2.5 bg-white/10 rounded-xl text-sm font-medium text-white border border-white/20 backdrop-blur-md">
                                <i class="fa-solid fa-pen text-emerald-400 mr-2"></i>Change Image
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button type="submit" id="submitBtn" class="w-full relative overflow-hidden group rounded-2xl bg-slate-900 p-[2px] transition-all hover:shadow-[0_0_40px_rgba(16,185,129,0.3)]">
                <div class="absolute inset-0 bg-gradient-to-r from-emerald-500 to-teal-500 opacity-70 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative flex items-center justify-center gap-3 bg-slate-900 group-hover:bg-slate-900/50 text-white font-semibold text-lg py-4 px-8 rounded-xl transition-all active:scale-[0.98]">
                    <i class="fa-solid fa-microchip text-emerald-400"></i>
                    <span id="btnText" class="tracking-wide">Run AI Analysis</span>
                </div>
            </button>
        </form>

        <!-- Dynamic Result Card -->
        <div id="resultBox" class="mt-8 hidden opacity-0 translate-y-4 transition-all duration-500 ease-out">
            <div class="bg-slate-800 rounded-2xl p-1 relative overflow-hidden border border-slate-700">
                <div id="resultAccent" class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-400"></div>
                <div class="bg-slate-900/50 rounded-xl p-6 relative flex items-center justify-between gap-4">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Diagnosis Result</p>
                        <h2 id="resultText" class="text-2xl font-bold text-white leading-tight"></h2>
                    </div>
                    <div id="statusIcon" class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 shadow-inner"></div>
                </div>
            </div>
        </div>

    </div>
    <script src="/static/script.js"></script>
</body>
</html>
